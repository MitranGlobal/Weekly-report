<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Ads Weekly Reports</title>
<style>
:root{color-scheme:light;--canvas:#EAEAEA;--tile:#fff;--ink:#252423;--muted:#605E5C;--line:#E1DFDD;--soft:#F3F2F1;--blue:#118DFF;--orange:#E66C37;--gold:#B88A00;--green:#107C10;--red:#C4314B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Segoe,-apple-system,Roboto,Arial,sans-serif;background:var(--canvas);color:var(--ink);font-size:13px;min-height:100vh;display:flex;flex-direction:column}
header{background:#252423;color:#fff;padding:14px max(16px,3vw);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:4px;background:linear-gradient(135deg,#F2C811,#E8A90E);display:grid;place-items:center;font-weight:800;color:#252423;font-size:12px}
header h1{font-size:17px;font-weight:600}
header nav{margin-left:auto;display:flex;gap:16px;font-size:13px}
header a{color:#C8C6C4;text-decoration:none}header a:hover{color:#fff}
.wrap{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;padding:14px max(16px,3vw);max-width:1300px;width:100%;margin:0 auto}
.side{background:var(--tile);box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:2px;padding:12px;align-self:start;position:sticky;top:14px}
.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}
summary{cursor:pointer;padding:8px 2px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:14px;height:11px;border-radius:2px;background:#F2C811;box-shadow:inset 0 3px 0 #E8A90E;flex-shrink:0}
summary .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.dates{display:flex;flex-direction:column;padding:0 0 8px 22px}
.dates button{all:unset;cursor:pointer;padding:6px 8px;border-radius:2px;display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.dates button small{color:var(--muted);font-size:11px}
.dates button:hover{background:var(--soft)}
.dates button.on{background:#252423;color:#fff}.dates button.on small{color:#C8C6C4}
.dates button:focus-visible{outline:2px solid var(--blue)}
.next{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.4;border-top:1px solid var(--line);padding-top:8px}
main{min-width:0;display:flex;flex-direction:column;gap:12px}
.tile{background:var(--tile);box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:2px;padding:14px 16px;min-width:0}
.top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.top h2{font-size:20px;font-weight:600}
.top p{color:var(--muted);margin-top:3px}
.dl{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#252423;color:#fff;text-decoration:none;padding:8px 14px;border-radius:2px;font-weight:600;font-size:13px}
.dl:hover{background:#3B3A39}
.dl svg{width:16px;height:16px}
.head{margin-top:12px;padding:10px 12px;background:var(--soft);border-left:4px solid var(--blue);font-size:14px;font-weight:600;line-height:1.45}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:2px;background:#FFF4CE;color:#795D00;margin-left:6px;font-weight:600;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}
.kpi{background:var(--tile);box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:2px;padding:12px 14px;border-top:4px solid var(--blue)}
.kpi:nth-child(2),.kpi:nth-child(3){border-top-color:var(--orange)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:300;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
h3{font-size:14px;font-weight:600;margin-bottom:10px}
.tips{list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{padding:8px 10px;border-left:4px solid var(--blue);background:#F8F8F8;line-height:1.5}
.tips li.good{border-color:var(--green)}.tips li.bad{border-color:var(--red)}.tips li.warn{border-color:#D9B300}
.acts{padding-left:20px;display:flex;flex-direction:column;gap:7px;line-height:1.5}
.acts li::marker{font-weight:700}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;padding-top:16px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px}
.bar i{display:block;width:70%;background:var(--blue);border-radius:2px 2px 0 0;min-height:1px}
.bar b{font-weight:400;font-size:10.5px;white-space:nowrap}
.bar span{color:var(--muted);text-align:center;line-height:1.2}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
.cmp td:first-child{white-space:nowrap}
table:not(.cmp) td:first-child{min-width:190px}
.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
footer{padding:12px max(16px,3vw);font-size:12px;color:var(--muted)}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static}.cols{grid-template-columns:1fr}.dl{margin-left:0}}
</style></head><body>
<header><div class="logo">BI</div><h1>Meta Ads · Weekly reports</h1>
<nav><a href="index.html">All reports</a><a href="meta.html">Full dashboard</a></nav></header>
<div class="wrap">
<aside class="side" aria-label="Reports by month"><h2>Reports</h2><div id="tree"><p class="note">Loading…</p></div>
<p class="next" id="next"></p></aside>
<main id="view"><div class="tile"><p class="note">Loading reports…</p></div></main>
</div>
<footer>MiTran Global · public reports · main ad account (mitranglobal ad account) · amounts in INR · a new report is added every Monday.</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=s=>new Date(s+"T00:00:00");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fd=(s,y)=>{const d=D(s);return d.getDate()+" "+MON[d.getMonth()]+(y?" "+d.getFullYear():"")};
function inr(v,dec=0){if(v==null)return"–";return"₹"+Number(v).toLocaleString("en-IN",{minimumFractionDigits:dec,maximumFractionDigits:dec})}
const num=(v,dec=0)=>v==null?"–":Number(v).toLocaleString("en-IN",{minimumFractionDigits:dec,maximumFractionDigits:dec});
function delta(v,goodWhen){ // goodWhen: "up" | "down" | null
  if(v==null)return'<span class="d nt">no comparison</span>';
  const s=(v>0?"+":"")+v.toFixed(0)+"% vs last week";
  if(Math.abs(v)<1||!goodWhen)return`<span class="d nt">${s}</span>`;
  const good=goodWhen==="up"?v>0:v<0;return`<span class="d ${good?"up":"dn"}">${s}</span>`}
let INDEX=[],CACHE={};
async function load(){
  try{const r=await fetch("reports/index.json",{cache:"no-store"});INDEX=(await r.json()).reports||[]}
  catch(e){$("#tree").innerHTML='<p class="note">Could not load the report list.</p>';$("#view").innerHTML='<div class="tile"><p class="note">Could not load reports. Try refreshing.</p></div>';return}
  drawTree();
  const want=location.hash.slice(1);
  show(INDEX.some(x=>x.report_date===want)?want:(INDEX[0]||{}).report_date);
  const last=INDEX[0]?D(INDEX[0].report_date):new Date();const nx=new Date(last);nx.setDate(nx.getDate()+7);
  $("#next").textContent=`Next report: Monday ${nx.getDate()} ${MON[nx.getMonth()]}, around 10:30 AM IST.`;
}
function drawTree(){
  const groups={};INDEX.forEach(r=>{const d=D(r.report_date),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");(groups[k]=groups[k]||[]).push(r)});
  const keys=Object.keys(groups).sort().reverse();
  $("#tree").innerHTML=keys.map((k,i)=>{const [y,m]=k.split("-");return`<details ${i===0?"open":""} data-k="${k}"><summary>${MONTH[m-1]} ${y}<span class="n">${groups[k].length}</span></summary><div class="dates">${
    groups[k].map(r=>`<button data-d="${r.report_date}" title="Week ${fd(r.week_start)} – ${fd(r.week_end)}">Mon ${fd(r.report_date)}<small>${r.spend?inr(r.spend):"no spend"}</small></button>`).join("")}</div></details>`}).join("")||'<p class="note">No reports yet.</p>';
  $("#tree").addEventListener("click",e=>{const b=e.target.closest("button[data-d]");if(b)show(b.dataset.d)});
}
async function show(date){
  if(!date){$("#view").innerHTML='<div class="tile"><p class="note">No reports yet. The first one arrives on Monday.</p></div>';return}
  document.querySelectorAll(".dates button").forEach(b=>b.classList.toggle("on",b.dataset.d===date));
  const det=document.querySelector(`button[data-d="${date}"]`)?.closest("details");if(det)det.open=true;
  if(location.hash.slice(1)!==date)history.replaceState(null,"","#"+date);
  let r=CACHE[date];
  if(!r){try{r=CACHE[date]=await (await fetch(`reports/${date}.json`,{cache:"no-store"})).json()}catch(e){$("#view").innerHTML='<div class="tile"><p class="note">Could not load this report.</p></div>';return}}
  render(r);
}
function render(r){
  const c=r.totals.cur,p=r.totals.prev,ch=r.totals.change,rl=r.result_label,one=rl.replace(/s$/,"");
  const k=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${d}</div>`;
  const daily=r.daily||[],mx=Math.max(1,...daily.map(x=>+x.spend||0)),anySpend=daily.some(x=>+x.spend>0);
  const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  $("#view").innerHTML=`
  <div class="tile"><div class="top"><div><h2>Week of ${fd(r.week_start)} – ${fd(r.week_end,true)}${r.backfilled?'<span class="badge">Backfilled</span>':""}</h2>
  <p>Report for Monday ${fd(r.report_date,true)} · compared with ${fd(r.prev_week_start)} – ${fd(r.prev_week_end)}</p></div>
  <a class="dl" href="${esc(r.pdf)}" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>Download report (PDF)</a></div>
  ${r.headline?`<div class="head">${esc(r.headline)}</div>`:""}</div>
  <div class="kpis">
   ${k("Amount spent",inr(c.spend),delta(ch.spend,null))}
   ${k(rl[0].toUpperCase()+rl.slice(1),num(c.results),delta(ch.results,"up"))}
   ${k("Cost per "+one,inr(c.cost_per_result),delta(ch.cost_per_result,"down"))}
   ${k("Leads",num(c.leads),delta(ch.leads,"up"))}
   ${k("Reach",num(c.reach),delta(ch.reach,"up"))}
   ${k("Link click rate",c.link_ctr==null?"–":num(c.link_ctr,2)+"%",delta(ch.link_ctr,"up"))}
  </div>
  <div class="cols">
   <div class="tile"><h3>What the numbers say</h3>${r.tips.length?`<ul class="tips">${r.tips.map(t=>`<li class="${esc(t.type)}"><b>${esc(t.title)}.</b> ${esc(t.text)}</li>`).join("")}</ul>`:'<p class="note">No notes this week.</p>'}</div>
   <div class="tile"><h3>This week's actions</h3>${r.actions.length?`<ol class="acts">${r.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>`:'<p class="note">Nothing to action.</p>'}</div>
  </div>
  <div class="cols">
   <div class="tile"><h3>Daily spend</h3>${anySpend?`<div class="chart" role="img" aria-label="Daily spend for the week">${daily.map(x=>{const v=+x.spend||0,d=D(x.date);return`<div class="bar"><b>${v?inr(v):""}</b><i style="height:${(v/mx*100).toFixed(1)}%"></i><span>${dn[d.getDay()]}<br>${d.getDate()}</span></div>`}).join("")}</div>`:'<p class="empty">No ads ran this week.</p>'}</div>
   <div class="tile"><h3>This week vs last week</h3><div class="tbl"><table class="cmp"><thead><tr><th></th><th class="r">This week</th><th class="r">Last week</th></tr></thead><tbody>
   ${[["Impressions",num(c.impressions),num(p.impressions)],["Link clicks",num(c.link_clicks),num(p.link_clicks)],["Frequency",num(c.frequency,2),num(p.frequency,2)],["Cost per 1,000 impressions",inr(c.cpm),inr(p.cpm)],["Cost per lead",inr(c.cost_per_lead),inr(p.cost_per_lead)],["Spend with no "+rl,inr(r.spend_without_results),"–"],["Days with spend",r.active_days+" of 7","–"]].map(x=>`<tr><td>${x[0]}</td><td class="r">${x[1]}</td><td class="r">${x[2]}</td></tr>`).join("")}
   </tbody></table></div></div>
  </div>
  <div class="tile"><h3>Campaigns</h3>${r.campaigns.length?`<div class="tbl"><table><thead><tr><th>Campaign</th><th>Status now</th><th class="r">Spend</th><th class="r">Last week</th><th class="r">${esc(rl[0].toUpperCase()+rl.slice(1))}</th><th class="r">Cost each</th><th class="r">Link click rate</th><th class="r">Frequency</th></tr></thead><tbody>
   ${r.campaigns.map(x=>{const a=x.cur;return`<tr><td>${esc(x.name)}</td><td>${esc((x.status||"").toLowerCase().replace(/^./,m=>m.toUpperCase()))}</td><td class="r">${inr(a.spend)}</td><td class="r">${inr(x.prev.spend)}</td><td class="r">${num(a.results)}</td><td class="r">${inr(a.cost_per_result)}</td><td class="r">${a.link_ctr==null?"–":num(a.link_ctr,2)+"%"}</td><td class="r">${num(a.frequency,2)}</td></tr>`}).join("")}
   </tbody></table></div>`:'<p class="note">No campaign spent money this week or last week.</p>'}
   <p class="note">Source: Meta Ads, account ${esc(r.account.id)}, pulled ${fd(r.pulled_at,true)}. Meta may adjust recent numbers slightly. Cost each = spend ÷ ${esc(rl)}; link click rate = link clicks ÷ impressions.</p></div>`;
}
window.addEventListener("hashchange",()=>{const d=location.hash.slice(1);if(INDEX.some(x=>x.report_date===d))show(d)});
load();
</script>
</body></html>
